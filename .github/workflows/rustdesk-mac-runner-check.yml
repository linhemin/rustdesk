name: macOS self-hosted runner check

on:
  workflow_dispatch:

permissions: {}

jobs:
  compiler-check:
    if: github.actor == 'linhemin' && github.triggering_actor == 'linhemin' && github.ref == 'refs/heads/master'
    environment: mac-runner-approval
    runs-on: rustdesk-mac-gated
    timeout-minutes: 5
    steps:
      - name: Verify Apple Silicon and compile a test program
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          printf '%s\n' 'int main(void) { return 0; }' |
            xcrun clang -x c - -o "$RUNNER_TEMP/rustdesk-runner-check"
          "$RUNNER_TEMP/rustdesk-runner-check"
          echo "Apple Silicon compiler check passed"
