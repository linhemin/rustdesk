name: P2P client builds

on:
  push:
    branches: [p2p-tun, p2p-live, p2p-cellular, ios-cellular-diagnostics, p2p-synchronized-ice, p2p-observed-paths-79, windows-first-check-80, synchronized-first-pair-81, mapped-pair-groups-82, adaptive-cellular-media-83, ios-latest-frame-84]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  ice-tests:
    if: contains(fromJSON('["p2p-cellular","ios-cellular-diagnostics","p2p-synchronized-ice","p2p-observed-paths-79","synchronized-first-pair-81","mapped-pair-groups-82","adaptive-cellular-media-83","ios-latest-frame-84"]'), github.ref_name)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Read the client ICE revision
        id: ice
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, tomllib
          with open('Cargo.toml', 'rb') as manifest:
              source = tomllib.load(manifest)['patch']['crates-io']['webrtc']
          assert source['git'] == 'https://github.com/linhemin/webrtc'
          assert re.fullmatch(r'[0-9a-f]{40}', source['rev'])
          print('revision=' + source['rev'])
          PY
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: linhemin/webrtc
          ref: ${{ steps.ice.outputs.revision }}
          path: ice-source
          persist-credentials: false
      - name: Test IPv4 translation and candidate gathering
        working-directory: ice-source
        run: |
          cargo test --locked -p webrtc-ice --lib nat64
          cargo test --locked -p webrtc-ice --lib agent_gather_test
      - name: Test ICE check accounting
        if: github.ref_name != 'p2p-cellular'
        working-directory: ice-source
        run: cargo test --locked -p webrtc-ice --lib

  windows:
    if: github.ref_name != 'ios-cellular-diagnostics'
    needs: bridge
    runs-on: windows-2022
    env:
      FLUTTER_VERSION: '3.24.5'
      VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - name: Prepare RustDesk's Windows Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent
          Copy-Item windows-x64-release/* "$flutterRoot/bin/cache/artifacts/engine/windows-x64-release/" -Force
      - name: Patch Flutter 3.24.5
        shell: bash
        run: git -C "$(dirname "$(dirname "$(which flutter)")")" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75'
          targets: x86_64-pc-windows-msvc
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - name: Install native build dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: '"$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"'
      - name: Build and test the Windows client
        shell: bash
        run: |
          python3 build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          FEATURES=$(python3 build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
          cargo test --locked --release --lib --features "$FEATURES" 'p2p::'
          cargo test --locked --release --lib --features "$FEATURES" client::webrtc_race_tests
          cargo test --locked --release --lib --features "$FEATURES" client::path_rtt::tests
          cargo test --locked --release --lib --features "$FEATURES" client::tcp_family_tests
          cargo test --locked --release --lib --features "$FEATURES" server::video_qos::tests
          cargo test --locked --release --lib --features "$FEATURES" client::video_delivery::tests
            cargo test --locked --release --lib --features "$FEATURES" flutter::rgba_frame::tests
          cargo test --locked --release --lib --features "$FEATURES" live_direct::
          cargo test --locked --release --lib --features "$FEATURES" ios_p2p_diagnostics::tests
          cargo test --locked --release --lib --features "$FEATURES" common::tests::test_secure_tcp
          cargo test --locked --release --lib --features "$FEATURES" common::tests::test_confirm_signed_direct_permission
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-p2p-tun-windows-x64-unsigned
          path: flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Package the Windows installer
        shell: pwsh
        run: ./.github/scripts/package-p2p-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-p2p-windows-x64-msi
          path: p2p-package/*.msi
          if-no-files-found: error

  ios:
    if: contains(fromJSON('["p2p-cellular","ios-cellular-diagnostics","p2p-synchronized-ice","p2p-observed-paths-79","synchronized-first-pair-81","mapped-pair-groups-82","adaptive-cellular-media-83","ios-latest-frame-84"]'), github.ref_name)
    needs: bridge
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      FLUTTER_VERSION: '3.24.5'
      VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Prepare Flutter and native tools
        run: |
          git -C "$(dirname "$(dirname "$(which flutter)")")" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          brew install nasm yasm
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75'
          targets: aarch64-apple-ios
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - name: Install iOS native dependencies
        run: '"$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: rustdesk-p2p-ios
          key: aarch64-apple-ios
          cache-on-failure: true
      - name: Compile RustDesk for iPhone
        run: cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib
      - name: Build the unsigned iPhone app
        working-directory: flutter
        run: flutter build ios --release --no-codesign --build-number=84
      - name: Test copying the active iPhone connection report
        working-directory: flutter
        run: flutter test --no-pub test/mobile_p2p_diagnostics_test.dart
      - name: Verify and package the app
        run: |
          app=flutter/build/ios/iphoneos/Runner.app
          info="$app/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$info")" = com.linhemin.rustdesk.p2p
          test "$(plutil -extract CFBundleVersion raw "$info")" = 84
          python3 - "$info" <<'PY'
          import pathlib, plistlib, sys
          info = plistlib.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert info.get("UIFileSharingEnabled")
          assert info.get("UISupportsDocumentBrowser") or info.get("LSSupportsOpeningDocumentsInPlace")
          runner = (pathlib.Path(sys.argv[1]).parent / info["CFBundleExecutable"]).read_bytes()
          assert all(s in runner for s in (b"RustDesk-P2P-diagnostics.txt", b"format=udp-paths-v3", b"udpCandidate", b"udpMapping", b"syncUdp peer"))
          flutter = (pathlib.Path(sys.argv[1]).parent / "Frameworks/App.framework/App").read_bytes()
          assert b"Copy P2P diagnostics" in flutter and b"format=udp-paths-v3" in flutter
          PY
          executable=$(plutil -extract CFBundleExecutable raw "$info")
          lipo "$app/$executable" -verify_arch arm64
          mkdir -p package/Payload
          ditto "$app" package/Payload/RustDesk.app
          (cd package && ditto -c -k --keepParent Payload rustdesk-p2p-ios-arm64-unsigned.ipa)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-p2p-ios-arm64-unsigned
          path: package/rustdesk-p2p-ios-arm64-unsigned.ipa
          if-no-files-found: error
